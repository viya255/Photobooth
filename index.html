function qrImageUrl(data, size){
  try {
    if (typeof qrcode === 'function') {
      var qr = qrcode(0, 'M');
      qr.addData(data);
      qr.make();
      return qr.createDataURL(6, 12);
    }
  } catch(e) {}
  return 'https://api.qrserver.com/v1/create-qr-code/?size='+(size||180)+'x'+(size||180)+'&data='+encodeURIComponent(data);
}

function compressBase64(dataUrl, maxSide = 1200, quality = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > h) {
        if (w > maxSide) { h = Math.round((h * maxSide) / w); w = maxSide; }
      } else {
        if (h > maxSide) { w = Math.round((h * maxSide) / h); h = maxSide; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function pushRealtimeSessionState(statusName) {
  if (!window.fbDb || !state.sessionId || state.isUpdatingFromLive) return;
  try {
    const { doc, setDoc } = window.fbFirestoreTools;
    const compressedPhotos = await Promise.all(state.photos.map(p => compressBase64(p, 1200, 0.85)));

    await setDoc(doc(window.fbDb, "active_sessions", state.sessionId), {
      sessionId: state.sessionId,
      status: statusName,
      photoCount: state.photos.length,
      maxPhotos: state.maxPhotos,
      photos: compressedPhotos,
      selectedFrameId: state.selectedFrame ? state.selectedFrame.id : null,
      placedPhotosState: placedPhotos.map(p => ({
        id: p.id, photoIdx: p.photoIdx, x: p.x, y: p.y, w: p.w, h: p.h, scale: p.scale
      })),
      updatedAt: Date.now()
    }, { merge: true });
  } catch(err) {
    console.error("Gagal sync ke Firebase:", err);
  }
}

function listenCurrentSessionLive() {
  if (!window.fbDb || !state.sessionId) return;
  const { doc, onSnapshot } = window.fbFirestoreTools;

  if (state.liveUnsubscribe) state.liveUnsubscribe();

  state.liveUnsubscribe = onSnapshot(doc(window.fbDb, "active_sessions", state.sessionId), async (docSnap) => {
    if (!docSnap.exists()) return;
    const data = docSnap.data();

    state.isUpdatingFromLive = true;

    if (data.photos && data.photos.length > 0 && !state.isOwnerDevice) {
      state.photos = data.photos;
    }

    if (data.selectedFrameId) {
      const foundFrame = state.frames.find(f => f.id === data.selectedFrameId);
      if (foundFrame) state.selectedFrame = foundFrame;
    }

    if (data.placedPhotosState && data.placedPhotosState.length > 0) {
      placedPhotos = data.placedPhotosState.map((p, idx) => {
        const photoIndex = p.photoIdx !== undefined ? p.photoIdx : idx;
        return {
          ...p,
          photoIdx: photoIndex,
          src: state.photos[photoIndex] || state.photos[idx] || ''
        };
      });
    }

    buildEditorFrameSelector();
    renderFreeEditor();
    
    await renderFinalCanvas();
    enableActionButtons();

    setTimeout(() => { state.isUpdatingFromLive = false; }, 100);
  });
}

}

function listenToActiveSessions() {
  if (!window.fbDb) return;
  const { collection, onSnapshot } = window.fbFirestoreTools;

  onSnapshot(collection(window.fbDb, "active_sessions"), (snapshot) => {
    const monitorList = document.getElementById('monitorList');
    if (!monitorList) return;
    monitorList.innerHTML = '';

    if (snapshot.empty) {
      monitorList.innerHTML = '<div style="text-align:center; color:var(--plum-soft); padding:20px;">Belum ada sesi aktif dari customer.</div>';
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const card = document.createElement('div');
      card.className = 'monitor-card';

      const timeAgo = Math.max(0, Math.round((Date.now() - (data.updatedAt || Date.now())) / 1000));
      
      let photoGridHTML = '';
      if (data.photos && data.photos.length > 0) {
        photoGridHTML = `<div style="display:flex; gap:8px; margin-top:8px; overflow-x:auto;">`;
        data.photos.forEach(pUrl => {
          photoGridHTML += `<img src="${pUrl}" style="width:60px; height:60px; object-fit:cover; border-radius:10px; border:2px solid var(--pink);">`;
        });
        photoGridHTML += `</div>`;
      }

      card.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <div style="width:46px; height:46px; background:var(--pink); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px;">📸</div>
          <div style="flex:1;">
            <span class="monitor-badge">${(data.status || 'Aktif').toUpperCase()}</span>
            <div style="font-size:15px; font-weight:700;">Sesi: ${data.sessionId}</div>
            <div style="font-size:12px; color:var(--plum-soft);">${data.photoCount || 0}/${data.maxPhotos || 3} foto terfoto · ${timeAgo} dtk lalu</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-ghost edit-session-btn" style="padding: 8px 14px; font-size: 12px;">👁️ Tonton / Edit</button>
            <button class="btn btn-danger del-session-btn" style="padding: 8px 12px; font-size: 12px;" title="Hapus Sesi">🗑️ Hapus</button>
          </div>
        </div>
        ${photoGridHTML}
      `;

      card.querySelector('.edit-session-btn').onclick = () => {
        openAdminLiveEditor(data.sessionId);
      };

      card.querySelector('.del-session-btn').onclick = (ev) => {
        ev.stopPropagation();
        if(confirm(`Hapus sesi ${data.sessionId}?`)) {
          deleteSessionFromFirebase(data.sessionId);
        }
      };

      monitorList.appendChild(card);
    });
  }, (err) => {
    console.error("Firestore Listen Error:", err);
  });
}

const CLEANUP_RETENTION_HOURS = 24;
let lastAutoCleanAt = 0;

async function runAutoCleanup(retentionHours = CLEANUP_RETENTION_HOURS){
  if (!window.fbDb) return;
  if (Date.now() - lastAutoCleanAt < 10 * 60 * 1000) return;
  lastAutoCleanAt = Date.now();

  try{
    const { collection, getDocs, query, where, deleteDoc, doc } = window.fbFirestoreTools;
    const cutoff = Date.now() - retentionHours * 60 * 60 * 1000;

    const sessionsSnap = await getDocs(query(collection(window.fbDb, "active_sessions"), where("updatedAt", "<", cutoff)));
    const sharedSnap = await getDocs(query(collection(window.fbDb, "shared_results"), where("createdAt", "<", cutoff)));

    const deletions = [];
    sessionsSnap.forEach(d => deletions.push(deleteDoc(doc(window.fbDb, "active_sessions", d.id))));
    sharedSnap.forEach(d => deletions.push(deleteDoc(doc(window.fbDb, "shared_results", d.id))));

    if (deletions.length > 0) {
      await Promise.all(deletions);
      console.log('Auto-clean: menghapus ' + deletions.length + ' data lama.');
    }
  }catch(err){
    console.error('Auto-clean gagal:', err);
  }
}

function loadStoredFrames() {
  if (!window.fbDb) return;
  const { collection, onSnapshot } = window.fbFirestoreTools;

  onSnapshot(collection(window.fbDb, "custom_frames"), (snapshot) => {
    const firebaseFrames = [];
    snapshot.forEach((docSnap) => {
      firebaseFrames.push({ id: docSnap.id, ...docSnap.data() });
    });

    const builtins = state.frames.filter(f => f.builtin);
    state.frames = [...builtins, ...firebaseFrames];

    const screenFrame = document.getElementById('screen-frame');
    const screenManage = document.getElementById('screen-manage-frames');
    
    if (screenFrame && screenFrame.classList.contains('active')) buildFrameGallery();
    if (screenManage && screenManage.classList.contains('active')) buildManageFrameGallery();
  });
}

function switchSource(src){
  state.camSource = src;
  document.getElementById('srcBuiltinBtn').classList.toggle('active', src==='builtin');
  document.getElementById('srcPhoneBtn').classList.toggle('active', src==='phone');
  document.getElementById('helpBuiltin').style.display = src==='builtin' ? 'block':'none';
  document.getElementById('helpPhone').style.display = src==='phone' ? 'block':'none';

  state.mirror = (src==='builtin');
  updateMirrorUI();

  if(src==='builtin'){
    if(state.camPeer){ state.camPeer.destroy(); state.camPeer=null; }
    document.getElementById('phoneQrArea').style.display='none';
    startBuiltinCamera();
  } else {
    stopCamera();
    videoEl.srcObject=null;
    document.getElementById('shutterBtn').disabled = true;
    startPhoneCameraPairing();
  }
}

function setCamStatus(msg, isError){
  const el=document.getElementById('camStatus');
  el.textContent=msg; el.classList.toggle('error', !!isError);
}

async function startBuiltinCamera(){
  setCamStatus('Menyiapkan kamera…');
  document.getElementById('shutterBtn').disabled=true;
  try{
    stopCamera();
    const constraints = { video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    state.stream=stream; videoEl.srcObject=stream;
    setCamStatus('Kamera HD siap! Ketuk tombol jepret ya ✿');
    document.getElementById('shutterBtn').disabled=false;
    updateMirrorUI();
  }catch(err){
    setCamStatus('Tidak bisa mengakses kamera. Pastikan izin kamera aktif.', true);
  }
}

function stopCamera(){
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
}

function startPhoneCameraPairing(){
  document.getElementById('phoneQrArea').style.display='block';
  const pairStatus=document.getElementById('camPairStatus');
  pairStatus.textContent='Menyiapkan kode QR…';

  if(state.camPeer) state.camPeer.destroy();
  const peer = new Peer();
  state.camPeer = peer;

  peer.on('open', (id)=>{
    const url = location.origin + location.pathname + '?camera=' + id;
    document.getElementById('camQrImg').src = qrImageUrl(url, 180);
    pairStatus.textContent = 'Scan QR ini pakai kamera HP yang ingin dijadikan kamera.';
  });
  peer.on('error', (err)=>{
    pairStatus.textContent = 'Gagal menyiapkan koneksi kamera HP: ' + err.type + '. Coba ulangi.';
  });
  peer.on('call', (call)=>{
    call.answer();
    state.camCall = call;
    call.on('stream', (remoteStream)=>{
      videoEl.srcObject = remoteStream;
      document.getElementById('phoneQrArea').style.display='none';
      setCamStatus('Kamera HP tersambung! Ketuk tombol jepret ✿');
      document.getElementById('shutterBtn').disabled=false;
      updateMirrorUI();
    });
    call.on('close', ()=>{
      setCamStatus('Koneksi kamera HP terputus.', true);
      document.getElementById('shutterBtn').disabled=true;
    });
  });
}

let isCountingDown = false;
document.getElementById('shutterBtn').onclick = () => {
  if (state.photos.length >= state.maxPhotos || isCountingDown) return;
  const w = videoEl.videoWidth, h = videoEl.videoHeight;
  if (!w || !h) return;

  let overlay = document.getElementById('countdownOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'countdownOverlay';
    overlay.style.cssText = 'position:absolute; font-size:100px; font-weight:800; color:white; text-shadow:0 4px 16px rgba(0,0,0,0.6); pointer-events:none; z-index:10; font-family:sans-serif;';
    document.getElementById('camWrap').appendChild(overlay);
  }

  isCountingDown = true;
  document.getElementById('shutterBtn').disabled = true;
  overlay.style.display = 'block';
  let count = 3;
  overlay.textContent = count;

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      overlay.textContent = count;
    } else {
      clearInterval(timer);
      overlay.style.display = 'none';
      isCountingDown = false;
      takePhoto(w, h);
    }
  }, 1000);
};

function takePhoto(w, h) {
  const canvas = document.createElement('canvas'); 
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  if (state.mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(videoEl, 0, 0, w, h);
  
  const dataUrl = canvas.toDataURL('image/jpeg', 0.98);
  state.pendingShot = dataUrl;

  const flash = document.getElementById('camFlash');
  if (flash) { flash.classList.remove('flash'); void flash.offsetWidth; flash.classList.add('flash'); }
  
  document.getElementById('reviewImg').src = dataUrl;
  document.getElementById('reviewOverlay').classList.add('show');
  document.getElementById('shutterBtn').disabled = false;
}

document.getElementById('retakeBtn').onclick=()=>{ document.getElementById('reviewOverlay').classList.remove('show'); state.pendingShot=null; };
document.getElementById('keepBtn').onclick=()=>{
  state.photos.push(state.pendingShot);
  renderShotsRow();
  document.getElementById('reviewOverlay').classList.remove('show');
  state.pendingShot=null;

  pushRealtimeSessionState('Mengambil Foto (' + state.photos.length + '/' + state.maxPhotos + ')');

  if(state.photos.length >= state.maxPhotos){
    setCamStatus(state.maxPhotos + ' foto tersimpan! Menuju pilih frame ✿');
    stopCamera();
    if(state.camPeer){ state.camPeer.destroy(); state.camPeer=null; }
    setTimeout(()=>{ 
      buildFrameGallery(); 
      showScreen('screen-frame'); 
      pushRealtimeSessionState('Memilih Frame');
    },500);
  } else {
    setCamStatus((state.maxPhotos - state.photos.length)+' foto lagi ya!');
  }
};

function renderShotsRow(){
  const row=document.getElementById('shotsRow'); row.innerHTML='';
  for(let i=0; i<state.maxPhotos; i++){
    const div=document.createElement('div'); div.className='shot-slot';
    if(state.photos[i]){ const img=document.createElement('img'); img.src=state.photos[i]; div.appendChild(img); }
    else{ div.textContent=(i+1); }
    row.appendChild(div);
  }
}

/* FRAME SCREEN */
function buildFrameGallery(){
  const gal = document.getElementById('frameGallery'); 
  gal.innerHTML = '';
  
  const filteredFrames = state.frames.filter(f => f.slots === state.maxPhotos);
  document.getElementById('frameSelectLead').textContent = `Menampilkan koleksi frame khusus untuk ${state.maxPhotos} jepretan. ✿`;

  if(filteredFrames.length === 0){
    gal.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:20px; color:var(--plum-soft);">Belum ada frame khusus ${state.maxPhotos} jepretan. Silakan tambah via Kelola Frame Admin.</div>`;
    return;
  }

  if (!state.selectedFrame || state.selectedFrame.slots !== state.maxPhotos) {
    state.selectedFrame = filteredFrames[0];
  }

  filteredFrames.forEach(f => {
    const el = document.createElement('div');
    el.className = 'frame-thumb' + (state.selectedFrame && state.selectedFrame.id === f.id ? ' selected' : '');
    
    if (f.builtin) {
      el.style.background = `linear-gradient(160deg, ${f.color}, white)`;
      el.innerHTML = `<div style="font-size:22px;">${f.emoji}</div><span class="label">${f.name}</span>`;
    } else {
      el.style.backgroundImage = `url(${f.dataUrl})`; 
      el.style.backgroundSize = 'cover';
      el.innerHTML = `<span class="label">${f.name}</span>`;
    }

    el.onclick = () => { 
      state.selectedFrame = f; 
      buildFrameGallery(); 
      pushRealtimeSessionState('Memilih Frame: ' + f.name);
    };
    gal.appendChild(el);
  });
}

function buildManageFrameGallery(){
  const gal=document.getElementById('manageFrameGallery'); gal.innerHTML='';
  const filtered = state.frames.filter(f => f.slots === state.manageFilterSlots);

  filtered.forEach(f=>{
    const el=document.createElement('div');
    el.className='frame-thumb';
    if(f.builtin){
      el.style.background=`linear-gradient(160deg, ${f.color}, white)`;
      el.innerHTML=`<div style="font-size:22px;">${f.emoji}</div><span class="label">${f.name}</span>`;
    } else {
      el.style.backgroundImage=`url(${f.dataUrl})`; el.style.backgroundSize='cover';
      el.innerHTML=`<span class="label">${f.name}</span>`;
      const del=document.createElement('button');
      del.className='del-btn'; del.textContent='✕'; del.title='Hapus frame ini';
      del.onclick=(ev)=>{
        ev.stopPropagation();
        if(window.fbDb) {
          const { doc, deleteDoc } = window.fbFirestoreTools;
          deleteDoc(doc(window.fbDb, "custom_frames", f.id));
        }
      };
      el.appendChild(del);
    }
    gal.appendChild(el);
  });

  const uploadTile=document.createElement('div');
  uploadTile.className='upload-frame-tile';
  uploadTile.innerHTML=`<span style="font-size:20px;">➕</span><span>Upload Frame (${state.manageFilterSlots} Jepretan)</span>`;
  uploadTile.onclick=()=>document.getElementById('frameUpload').click();
  gal.appendChild(uploadTile);

  document.getElementById('frameSizeNote').innerHTML =
  `Ukuran frame custom (6x15 HD): <b>1200 × 3000px</b>, PNG transparan. Upload ini akan langsung tersimpan ke Cloud Firestore & sync ke perangkat booth.`;
}

document.getElementById('frameUpload').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async () => {
    const frameData = {
      slots: state.manageFilterSlots,
      name: `Custom (${state.manageFilterSlots} Shot)`,
      dataUrl: reader.result,
      builtin: false,
      createdAt: Date.now()
    };

    if (window.fbDb) {
      const { collection, addDoc } = window.fbFirestoreTools;
      await addDoc(collection(window.fbDb, "custom_frames"), frameData);
      alert('Frame berhasil tersimpan! ✿');
    }
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};

/* EDITOR OTOMATIS PLACEMENT & REALTIME PUSH */
function setupEditorWorkspace(){
  placedPhotos = [];
  selectedPlacedPhotoId = null;

  const previewW = 220;
  const photoW = 165;
  const photoH = state.maxPhotos === 3 ? 120 : 95;
  const startY = state.maxPhotos === 3 ? 40 : 30;
  const gapY = state.maxPhotos === 3 ? 140 : 110;

  state.photos.forEach((photoSrc, idx) => {
    const defaultY = startY + idx * gapY;
    const defaultX = (previewW - photoW) / 2;
    placedPhotos.push({
      id: 'p-' + Date.now() + '-' + idx,
      photoIdx: idx,
      src: photoSrc,
      x: defaultX,
      y: defaultY,
      w: photoW,
      h: photoH,
      scale: 1.0
    });
  });

  if(placedPhotos.length > 0) { selectedPlacedPhotoId = placedPhotos[0].id; }

  buildEditorFrameSelector();
  renderFreeEditor();
}

function buildEditorFrameSelector(){
  const wrap = document.getElementById('editorFrameSelector');
  if(!wrap) return;
  wrap.innerHTML = '';

  const filtered = state.frames.filter(f => f.slots === state.maxPhotos);
  filtered.forEach(f => {
    const card = document.createElement('div');
    card.className = 'frame-mini-card' + (state.selectedFrame && state.selectedFrame.id === f.id ? ' selected' : '');
    
    if(f.builtin){
      card.style.background = `linear-gradient(160deg, ${f.color}, white)`;
      card.innerHTML = `<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px;">${f.emoji}</div>`;
    } else {
      card.style.backgroundImage = `url(${f.dataUrl})`;
    }

    card.onclick = () => {
      state.selectedFrame = f;
      buildEditorFrameSelector();
      renderFreeEditor();
      pushRealtimeSessionState('Ganti Frame: ' + f.name);
    };
    wrap.appendChild(card);
  });
}

function renderFreeEditor(){
  const wrap = document.getElementById('stripPreviewFinal');
  if(!wrap) return;

  const f = state.selectedFrame || state.frames[0];
  wrap.innerHTML = '';

  if (f.builtin) {
    wrap.style.background = `linear-gradient(170deg, ${f.color}, white)`;
  } else {
    wrap.style.background = '#ffffff';
  }

  const layer = document.createElement('div');
  layer.className = 'free-photo-layer';

  placedPhotos.forEach((item) => {
    const el = document.createElement('div');
    el.className = 'placed-photo' + (selectedPlacedPhotoId === item.id ? ' selected' : '');
    
    const curW = item.w * item.scale;
    const curH = item.h * item.scale;

    el.style.left = item.x + 'px';
    el.style.top = item.y + 'px';
    el.style.width = curW + 'px';
    el.style.height = curH + 'px';

    const imgSrc = item.src || state.photos[item.photoIdx] || '';
    const img = document.createElement('img');
    img.src = imgSrc;
    el.appendChild(img);

    const delBtn = document.createElement('button');
    delBtn.className = 'photo-del-btn';
    delBtn.textContent = '✕';
    delBtn.onclick = (ev) => {
      ev.stopPropagation();
      placedPhotos = placedPhotos.filter(x => x.id !== item.id);
      renderFreeEditor();
      if(state.finalReady) renderFinalCanvas();
      pushRealtimeSessionState('Hapus Foto');
    };
    el.appendChild(delBtn);

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'photo-resize-handle';
    resizeHandle.textContent = '⤢';

    let isResizing = false, startRClientX = 0, initialScale = 1.0;

    const onResizeDown = (e) => {
      e.preventDefault();
      e.stopPropagation();
      isResizing = true;
      selectedPlacedPhotoId = item.id;
      
      startRClientX = e.clientX || (e.touches && e.touches[0].clientX);
      initialScale = item.scale;

      const onResizeMove = (moveEv) => {
        if (!isResizing) return;
        const curX = moveEv.clientX || (moveEv.touches && moveEv.touches[0].clientX);
        const deltaX = curX - startRClientX;
        
        let newScale = initialScale + (deltaX / 100);
        item.scale = Math.max(0.4, Math.min(3.0, newScale));
        
        renderFreeEditor();
        if (state.finalReady) renderFinalCanvas();
      };

      const onResizeUp = () => {
        isResizing = false;
        window.removeEventListener('pointermove', onResizeMove);
        window.removeEventListener('pointerup', onResizeUp);
        pushRealtimeSessionState('Resize Foto via Handle');
      };

      window.addEventListener('pointermove', onResizeMove);
      window.addEventListener('pointerup', onResizeUp);
    };

    resizeHandle.addEventListener('pointerdown', onResizeDown);
    el.appendChild(resizeHandle);

    el.onwheel = (e) => {
      e.preventDefault();
      let delta = e.deltaY < 0 ? 0.05 : -0.05;
      item.scale = Math.max(0.4, Math.min(3.0, item.scale + delta));
      renderFreeEditor();
      if(state.finalReady) renderFinalCanvas();
      pushRealtimeSessionState('Zoom Foto');
    };

    let isDragging = false, startX = 0, startY = 0;
    const onPointerDown = (e) => {
      if(e.target.classList.contains('photo-del-btn') || e.target.classList.contains('photo-resize-handle')) return;
      e.preventDefault();
      isDragging = true; selectedPlacedPhotoId = item.id;
      document.querySelectorAll('.placed-photo').forEach(node => node.classList.remove('selected'));
      el.classList.add('selected');

      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      startX = clientX - item.x; startY = clientY - item.y;

      const onPointerMove = (moveEv) => {
        if (!isDragging) return;
        const curX = moveEv.clientX || (moveEv.touches && moveEv.touches[0].clientX);
        const curY = moveEv.clientY || (moveEv.touches && moveEv.touches[0].clientY);
        item.x = curX - startX; item.y = curY - startY;
        el.style.left = item.x + 'px'; el.style.top = item.y + 'px';
        if(state.finalReady) renderFinalCanvas();
      };
      const onPointerUp = () => {
        isDragging = false;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        pushRealtimeSessionState('Mengatur Posisi Foto');
      };
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
    };
    el.addEventListener('pointerdown', onPointerDown);

    layer.appendChild(el);
  });

  wrap.appendChild(layer);

  if (!f.builtin && f.dataUrl) {
    const frameOverlay = document.createElement('img');
    frameOverlay.className = 'frame-overlay-img';
    frameOverlay.src = f.dataUrl;
    wrap.appendChild(frameOverlay);
  }

  if(state.finalReady) { renderFinalCanvas(); }
}

/* RENDER CANVAS HD */
function renderFinalCanvas(){
  return new Promise((resolve)=>{
    const canvas = document.getElementById('finalCanvas');
    const ctx = canvas.getContext('2d');
    
    const W = 1200, H = 3000, previewW = 220;
    const scaleFactor = W / previewW;

    canvas.width = W; 
    canvas.height = H;
    
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const f = state.selectedFrame || state.frames[0];

    if(f.builtin){
      const grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0, f.color); 
      grad.addColorStop(1, '#ffffff');
      ctx.fillStyle = grad; 
      ctx.fillRect(0,0,W,H);
    } else {
      ctx.fillStyle = '#ffffff'; 
      ctx.fillRect(0,0,W,H);
    }

    if(placedPhotos.length === 0) { resolve(); return; }

    let loaded = 0; 
    const total = placedPhotos.length;

    const checkComplete = () => {
      loaded++;
      if (loaded >= total) {
        if (!f.builtin && f.dataUrl) {
          const overlay = new Image();
          overlay.crossOrigin = "anonymous";
          overlay.onload = () => { ctx.drawImage(overlay, 0, 0, W, H); resolve(); };
          overlay.onerror = () => resolve();
          overlay.src = f.dataUrl;
        } else {
          resolve();
        }
      }
    };

    placedPhotos.forEach((item) => {
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.onload = () => {
        const renderX = item.x * scaleFactor;
        const renderY = item.y * scaleFactor;
        const renderW = item.w * item.scale * scaleFactor;
        const renderH = item.h * item.scale * scaleFactor;

        const imgRatio = im.width / im.height;
        const targetRatio = renderW / renderH;

        let sx, sy, sWidth, sHeight;
        if (imgRatio > targetRatio) {
          sHeight = im.height;
          sWidth = im.height * targetRatio;
          sx = (im.width - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = im.width;
          sHeight = im.width / targetRatio;
          sx = 0;
          sy = (im.height - sHeight) / 2;
        }

        ctx.drawImage(im, sx, sy, sWidth, sHeight, renderX, renderY, renderW, renderH);
        checkComplete();
      };
      im.onerror = () => checkComplete();
      im.src = state.photos[item.photoIdx] || item.src || '';
    });
  });
}

/* UPLOAD FOTO HD KE FIRESTORE UNTUK SHARED RESULT */
async function pushFinalImageToShare(){
  if(!window.fbDb || !state.sessionId) return false;
  
  await renderFinalCanvas();
  const canvas = document.getElementById('finalCanvas');
  
  try{
    const rawDataUrl = canvas.toDataURL('image/png', 1.0);
    const HDImage = await compressBase64(rawDataUrl, 1600, 0.92);

    const { doc, setDoc } = window.fbFirestoreTools;
    const cleanCode = state.sessionId.trim().toUpperCase();

    await setDoc(doc(window.fbDb, "shared_results", cleanCode), {
      code: cleanCode,
      image: HDImage,
      createdAt: Date.now()
    });
    return true;
  }catch(err){
    console.error('Gagal upload foto HD ke shared_results:', err);
    return false;
  }
}

function fetchSharedResult(code, onFound, onNotFound){
  if(!window.fbDb || !code){ onNotFound(); return; }
  
  const { doc, getDoc } = window.fbFirestoreTools;
  const cleanCode = code.trim().toUpperCase();

  getDoc(doc(window.fbDb, "shared_results", cleanCode))
    .then((docSnap) => {
      if(docSnap.exists() && docSnap.data().image){
        onFound(docSnap.data().image);
      } else {
        onNotFound();
      }
    })
    .catch((err) => {
      console.error("Error membaca Firestore di HP:", err);
      onNotFound();
    });
}

function showSendCodeBox(){
  const codeBox = document.getElementById('codeBox');

  codeBox.style.display = 'block';

  retryRow.style.display = 'none';
  codeBoxText.textContent = '⏳ Memproses & mengunggah foto HD, mohon tunggu...';

  pushFinalImageToShare().then((ok)=>{
    if(!ok){
      codeBoxText.textContent = '❌ Gagal mengunggah foto. Cek koneksi internet lalu coba lagi.';
      retryRow.style.display = 'flex';

    document.getElementById('qrImg').src = qrImageUrl(url, 180);

function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }catch(e){ return []; }
}

function saveHistory(){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(0,HISTORY_MAX))); }catch(e){}
}

function makeThumbnail(sourceCanvas, maxW){
  try{
    const scale=maxW/sourceCanvas.width;
    const tw=maxW, th=Math.round(sourceCanvas.height*scale);
    const tc=document.createElement('canvas'); tc.width=tw; tc.height=th;
    tc.getContext('2d').drawImage(sourceCanvas,0,0,tw,th);
    return tc.toDataURL('image/jpeg',0.85);
  }catch(e){ return null; }
}

function addToHistory(dataUrl){
  state.history.unshift({id:'h'+Date.now(), dataUrl, time:Date.now()});
  saveHistory(); renderHistoryAll();
}

function renderHistoryAll(){ renderHistoryFull(); }

function renderHistoryFull(){
  const wrap=document.getElementById('historyListFull'); if(!wrap) return;
  wrap.innerHTML='';
  state.history.forEach((item, idx)=>{
    const row=document.createElement('div'); row.className='history-row';
    row.innerHTML=`<img src="${item.dataUrl}"><div class="meta"><b>Sesi #${state.history.length-idx}</b></div>`;
    wrap.appendChild(row);

}

let cameraModeHostId = null;
let cameraModeState = { peer: null, stream: null, call: null };

document.getElementById('beCameraStartBtn').onclick = async () => {
  const statusEl = document.getElementById('beCameraStatus');
  const btn = document.getElementById('beCameraStartBtn');
  btn.disabled = true;
  statusEl.textContent = 'Menyalakan kamera HP…';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    cameraModeState.stream = stream;
    document.getElementById('selfPreview').srcObject = stream;

    const peer = new Peer();
    cameraModeState.peer = peer;

    peer.on('open', () => {
      statusEl.textContent = 'Menyambung ke layar utama…';
      const call = peer.call(cameraModeHostId, stream);
      cameraModeState.call = call;
      if(!call){
        statusEl.textContent = 'Gagal menyambung. Kembali & scan ulang QR di layar utama.';
        btn.disabled = false;
        return;
      }
      call.on('error', ()=>{
        statusEl.textContent = 'Koneksi ke layar utama gagal. Scan ulang QR-nya.';
        btn.disabled = false;
      });
      call.on('close', ()=>{
        statusEl.textContent = 'Koneksi ke layar utama terputus.';
        btn.disabled = false;
      });
      statusEl.textContent = 'Tersambung! Foto akan diambil dari layar utama ✿';
    });
    peer.on('error', (err) => {
      statusEl.textContent = 'Koneksi gagal: ' + err.type + '. Coba muat ulang halaman ini.';
      btn.disabled = false;
    });
  }catch(err){
    statusEl.textContent = 'Tidak bisa mengakses kamera HP. Pastikan izin kamera diizinkan di browser.';
    btn.disabled = false;
  }
};

function handleUrlParams(){
  const params = new URLSearchParams(location.search);
  const cameraHostId = params.get('camera');
  const sendCode = params.get('send');

  if(cameraHostId){
    cameraModeHostId = cameraHostId;
    setMinimalMode(true);
    showScreen('screen-be-camera');
    return;
  }
  if(sendCode){
    setMinimalMode(true);
    showScreen('screen-receive');
    startReceiveFlow(sendCode);
    return;
  }
}

updateRoleUI();
state.history = loadHistory();
handleUrlParams();
setTimeout(() => { runAutoCleanup(); }, 3000);
